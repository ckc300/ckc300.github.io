<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>雨軒計時器</title>
<meta name="description" content="雨軒計時器提供5至7分鐘、1至2分鐘、2至3分鐘及自訂時間的演講燈號計時功能。"/>
<link rel="canonical" href="https://ckc300.github.io/Timer/timer.html"/>
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: 'Noto Sans TC', sans-serif;
  transition: background-color 0.4s ease;
}

/* === 開場動畫 === */
#intro {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: introFade 2.4s ease forwards;
}
#intro img {
  width: 120px;
  height: auto;
  margin-bottom: 0.6em;
  filter: drop-shadow(0 0 10px #FFD700);
}
#intro .intro-title {
  font-size: 2.2em;
  color: #FFD700;
  letter-spacing: 0.1em;
  animation: textGlow 2s infinite alternate;
}
@keyframes introFade {
  0% { opacity: 0; }
  10% { opacity: 1; }
  85% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}
@keyframes textGlow {
  from { text-shadow: 0 0 4px #FFD700, 0 0 10px #FFD700; }
  to   { text-shadow: 0 0 15px #FFD700, 0 0 30px #FFDD55; }
}

/* 標題呼吸動畫 */
@keyframes breathe {0%{filter:brightness(0.9);}50%{filter:brightness(1.3);}100%{filter:brightness(0.9);}}
@keyframes titleBreatheBW {
  0%{color:rgb(128,128,128);}25%{color:rgb(191,191,191);}50%{color:rgb(255,255,255);}
  75%{color:rgb(191,191,191);}100%{color:rgb(128,128,128);}
}

/* 框架容器 */
#appContainer {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  overflow: hidden; background: inherit;
}
#appContent {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(1);
  width: 360px; height: 640px; transform-origin: center;
}

/* 橫式提示 */
#rotateTip {
  display: none; position: fixed; inset: 0;
  background: #000; color: #FFD700;
  font-size: 1.8em; font-weight: bold;
  justify-content: center; align-items: center;
  z-index: 999;
}

/* 標題列 */
.header {
  display: flex; justify-content: center; align-items: center; gap: 1.2em;
  margin: 0.8em auto 0.5em; width: fit-content; text-align: center;
}
.header img {
  height: clamp(60px, 10vw, 100px);
  width: auto; animation: breathe 3s ease-in-out infinite;
}
.header h1 {
  font-size: clamp(2rem, 6vw, 2.6rem); /* ✅ 調整字級範圍 */
  font-weight: normal;                 /* ✅ 移除加粗 */
  letter-spacing: 0.05em;              /* ✅ 微縮字距 */
  margin: 0;
  white-space: nowrap;                 /* ✅ 強制單行顯示 */
  transition: color 0.4s ease;
  animation: titleBreatheBW 3.5s ease-in-out infinite;
}

/* 分隔線 */
.divider {width:90%;max-width:500px;height:1px;margin:0.6em auto 1.2em;background:rgba(102,102,102,0.4);}

/* 預設按鈕列 */
.presets {
  display:flex;justify-content:space-between;align-items:center;gap:0.8em;
  width:90%;max-width:420px;margin:1.2em auto;
}
.preset-btn {
  flex:1 1 0;aspect-ratio:1/1;border-radius:50%;
  background:#444;border:none;color:#ccc;font-weight:bold;
  font-size:clamp(0.9em,2vw,1em);
  cursor:pointer;transition:transform .15s,background .2s;
}
.preset-btn.selected {background:#222;color:#FFD700;transform:scale(1.08);border:2px solid #FFD700;}
/* 計時顯示 */
.timer-display {
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;font-weight:bold;
  background:#000;color:#fff;border-radius:20px;text-align:center;
  width:90%;max-width:90vw;height:35vh;display:flex;align-items:center;justify-content:center;
  margin:1em 0 2em;box-shadow:0 2px 10px #0006;
}
.timer-display span {font-size:clamp(6rem,25vw,14rem);}
#symbol {
  position:absolute;top:8px;right:14px;font-size:2rem;user-select:none;
  text-shadow:2px 2px 4px rgba(0,0,0,0.6);
}

/* === 手機顯示 === */
@media (max-width:480px){
  .timer-display{width:95%;height:20vh;margin:0.6em auto 1.4em;}
  .timer-display span{font-size:clamp(5rem,27vw,13rem);}
  .bottom-bar button{font-size:0.9em;padding:0.25em 0.8em;min-height:38px;}
  .bottom-bar{bottom:40px;padding:0 0.8em;}
}

/* === 平板優化 === */
@media (min-width:768px) and (max-width:1024px){
  .timer-display{height:25vh;}
  .controls{gap:2em;}
  .preset-btn{font-size:1.1em;}
}

/* === 按鈕閃爍效果 === */
button.flash {animation:flashBorder 0.3s ease;}
@keyframes flashBorder {
  0% {box-shadow:0 0 8px 3px #FFD700;}
  100% {box-shadow:none;}
}

/* 控制按鈕 */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin-bottom: 3em;
}
.controls button {
  min-height: unset;
  padding: 0.4em 1.6em;
  border-radius: 10px;
  font-size: 1.2em;
  font-weight: bold;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: filter .15s, background .2s, color .2s;
}
#mainControl {
  background: #444; color: #ccc;
}
#reset {
  background: #444; color: #777;
}
#mainControl.active, #reset.active {
  background: #FFD700;
  color: #000;
  border: 2px solid #000;
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
}

/* 底部欄 */
.bottom-bar {
  position: fixed; bottom: 10px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 0 1em;
  transition: opacity 0.3s ease;
}
.bottom-bar.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.bottom-bar button {
  background: #222; color: #fff;
  border: 2px solid #fff;
  border-radius: 10px;
  font-weight: bold;
  font-size: 1em;
  min-height: 48px;
  padding: 0.4em 1.3em;
  cursor: pointer;
}

/* Modal */
.modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center; align-items: center;
  z-index: 100;
}
.modal-content {
  background: #181818;
  color: #fff;
  padding: 20px 6vw;
  border-radius: 16px;
  text-align: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.custom-row { margin: 0.8em 0; }
select {
  font-size: 1.1em;
  border-radius: 6px;
  border: 2px solid #FFD700;
  background: #000;
  color: #FFD700;
  padding: 0.2em 0.6em;
}
.modal-btns {
  display: flex; justify-content: center; gap: 1.2em;
  margin-top: 1em;
}
.modal-btns button {
  border-radius: 10px;
  font-size: 1.1em; font-weight: bold;
  padding: 0.5em 1.2em;
  cursor: pointer;
  border: none;
}
#applyBtn {
  background: #444; color: #999;
}
#applyBtn.active {
  background: #FFD700; color: #000;
}
#cancelBtn {
  background: #FFD700; color: #000;
}
</style>
<link rel="stylesheet" href="../css/timer-interface.css"/>
</head>

<body>
<div id="intro">
  <img src="Pathways_Power_Hub.webp" alt="頭像" width="558" height="580">
  <div class="intro-title" aria-hidden="true">雨軒計時器</div>
</div>

<div id="rotateTip">請旋轉手機以直式螢幕操作 📱</div>

<div id="appContainer">
  <div id="appContent">
    <div id="symbol"></div>
    <div class="header" id="header">
      <img id="avatar" src="Pathways_Power_Hub.webp" alt="頭像" width="558" height="580">
      <h1 id="title">雨軒計時器</h1>
    </div>
    <div class="divider"></div>

    <div class="presets">
      <button class="preset-btn" onclick="setPreset(5,6,7,7.5,this)">5–7分<br>±30秒</button>
      <button class="preset-btn" onclick="setPreset(1,1.5,2,2.5,this)">1–2分<br>+30秒</button>
      <button class="preset-btn" onclick="setPreset(2,2.5,3,3.5,this)">2–3分<br>±30秒</button>
      <button class="preset-btn" onclick="openCustomModal(this)">自定義</button>
    </div>

    <div class="timer-display" id="display"><span>00:00</span></div>

    <div class="controls">
      <button id="mainControl" onclick="buttonFlash(this); mainControl();" disabled>▶️ 開始</button>
      <button id="reset" onclick="buttonFlash(this); resetTimer();" disabled>🔁 歸零</button>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <button id="homeBtn" onclick="location.href='https://ckc300.github.io/'">🏠 回首頁</button>
      <button id="fsBtn" onclick="buttonFlash(this); toggleFullscreen()">🔲 全螢幕</button>
    </div>

    <div class="timer-notices" role="status" aria-live="polite">
      <p id="wakeNotice" hidden></p>
      <p id="fullscreenNotice" hidden></p>
    </div>
    <div class="modal" id="customModal" role="dialog" aria-modal="true" aria-labelledby="customTitle">
      <div class="modal-content">
        <h3 id="customTitle">自定義時間設定</h3>
        <div class="custom-row">綠燈：<select id="gMin" aria-label="綠燈分鐘"></select>分<select id="gSec" aria-label="綠燈秒數"></select>秒</div>
        <div class="custom-row">黃燈：<select id="yMin" aria-label="黃燈分鐘"></select>分<select id="ySec" aria-label="黃燈秒數"></select>秒</div>
        <div class="custom-row">紅燈：<select id="rMin" aria-label="紅燈分鐘"></select>分<select id="rSec" aria-label="紅燈秒數"></select>秒</div>
        <div class="custom-row">閃紅：<select id="bMin" aria-label="閃紅分鐘"></select>分<select id="bSec" aria-label="閃紅秒數"></select>秒</div>
        <div class="modal-btns">
          <button id="applyBtn" onclick="buttonFlash(this); applyCustom();" disabled>套用</button>
          <button id="cancelBtn" onclick="buttonFlash(this); closeModal()">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 第3段開始 -->
<script>
/* === 防鎖屏：無法取得時明確提示，不使用無效影片假裝成功。 === */
let wakeLock = null;
let wakeRequest = null;
let wakeGeneration = 0;
function setNotice(id, message) {
  const notice = document.getElementById(id);
  notice.textContent = message;
  notice.hidden = !message;
}
function requestWakeLock() {
  if (document.visibilityState !== 'visible') return Promise.resolve();
  if (wakeLock && !wakeLock.released) return Promise.resolve();
  if (wakeRequest) return wakeRequest;
  const generation = wakeGeneration;
  const pending = (async () => {
    if (!navigator.wakeLock || typeof navigator.wakeLock.request !== 'function') {
      setNotice('wakeNotice', '此瀏覽器無法防止自動鎖屏；計時前請調整裝置的自動鎖屏設定。');
      return;
    }
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (generation !== wakeGeneration || document.visibilityState !== 'visible') {
        await lock.release();
        return;
      }
      wakeLock = lock;
      lock.addEventListener('release', () => {
        if (wakeLock !== lock) return;
        wakeLock = null;
        if (document.visibilityState === 'visible') {
          setNotice('wakeNotice', '防鎖屏已中斷，螢幕可能自動熄滅；請檢查裝置的自動鎖屏設定。');
        }
      });
      setNotice('wakeNotice', lock.released ? '尚未啟用防鎖屏，請檢查裝置的自動鎖屏設定。' : '');
    } catch (err) {
      if (generation === wakeGeneration && document.visibilityState === 'visible') {
        setNotice('wakeNotice', '尚未啟用防鎖屏，螢幕可能自動熄滅；請檢查瀏覽器權限或裝置的自動鎖屏設定。');
      }
    }
  })();
  wakeRequest = pending;
  pending.finally(() => { if (wakeRequest === pending) wakeRequest = null; });
  return pending;
}
async function releaseWakeLock() {
  wakeGeneration++;
  wakeRequest = null;
  const lock = wakeLock;
  wakeLock = null;
  if (lock && !lock.released) {
    try { await lock.release(); } catch (err) { /* 已失效的鎖無須重複釋放。 */ }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
  else releaseWakeLock();
});
window.addEventListener('pagehide', releaseWakeLock);
window.addEventListener('pageshow', requestWakeLock);
window.addEventListener('load', requestWakeLock);

/* === 狀態物件 === */
const TimerState = {
  status: 'init',
  thresholds: {green:0,yellow:0,red:0,blink:0},
  time: 0,
  elapsedMs: 0,
  startAt: 0,
  timer: null,
  blink: null,
  blinkState: false,
  selectedPreset: null
};

/* === 初始化自定義選單 === */
function initSelects(){
  const config={g:[3,40],y:[4,40],r:[5,40],b:[6,40]};
  const secs=[0,30];
  for(let p of ['g','y','r','b']){
    const minSel=document.getElementById(p+'Min');
    const secSel=document.getElementById(p+'Sec');

    let pm=document.createElement('option'); pm.value=""; pm.text="--"; pm.selected=true; pm.disabled=true; minSel.appendChild(pm);
    let ps=document.createElement('option'); ps.value=""; ps.text="--"; ps.selected=true; ps.disabled=true; secSel.appendChild(ps);

    for(let i=config[p][0];i<=config[p][1];i++){
      let o=document.createElement('option'); o.value=i;o.text=i;minSel.appendChild(o);
    }
    for(let s of secs){
      let o=document.createElement('option'); o.value=s;o.text=s.toString().padStart(2,'0');secSel.appendChild(o);
    }

    minSel.addEventListener('change',checkCustomInputs);
    secSel.addEventListener('change',checkCustomInputs);
  }
}
initSelects();

/* === 按鈕閃光回饋 === */
function buttonFlash(btn){
  btn.classList.add('flash');
  setTimeout(()=>btn.classList.remove('flash'),300);
}

/* === UI控制 === */
function toggleBottomBar(show){
  const bar=document.getElementById('bottomBar');
  bar.classList.toggle('hidden', !show);
  bar.inert=!show;
  if(show) bar.removeAttribute('aria-hidden');
  else bar.setAttribute('aria-hidden','true');
}
let modalTrigger=null;
let modalBackground=[];
function isCustomModalOpen(){return document.getElementById('customModal').style.display==='flex';}
function openCustomModal(btn){
  if(TimerState.status!=='init' || isCustomModalOpen())return;
  modalTrigger=btn;
  const modal=document.getElementById('customModal');
  modal.style.display='flex';
  checkCustomInputs();
  document.getElementById('gMin').focus();
  modalBackground=[...modal.parentElement.children].filter(el=>el!==modal).map(el=>({el,inert:el.inert}));
  modalBackground.forEach(({el})=>{el.inert=true;});
}
function closeModal(){
  if(!isCustomModalOpen())return;
  document.getElementById('customModal').style.display='none';
  modalBackground.forEach(({el,inert})=>{el.inert=inert;});
  modalBackground=[];
  if(modalTrigger && !modalTrigger.disabled)modalTrigger.focus();
}
document.getElementById('customModal').addEventListener('keydown', e=>{
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key!=='Tab')return;
  const items=[...e.currentTarget.querySelectorAll('select:not(:disabled),button:not(:disabled)')];
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
});
document.addEventListener('focusin', e=>{
  const modal=document.getElementById('customModal');
  if(isCustomModalOpen() && !modal.contains(e.target))document.getElementById('gMin').focus();
});

function getVal(id){
  const m=document.getElementById(id).value;
  const s=document.getElementById(id.replace('Min','Sec')).value;
  if(m===""||s==="")return NaN;
  return parseInt(m)*60+parseInt(s);
}
function checkCustomInputs(){
  const g=getVal('gMin'),y=getVal('yMin'),r=getVal('rMin'),b=getVal('bMin');
  const btn=document.getElementById('applyBtn');
  if([g,y,r,b].some(isNaN)||!(g<y && y<r && r<b)){
    btn.disabled=true;btn.classList.remove('active');return;
  }
  btn.disabled=false;btn.classList.add('active');
}
function applyCustom(){
  const g=getVal('gMin'),y=getVal('yMin'),r=getVal('rMin'),b=getVal('bMin');
  if([g,y,r,b].some(isNaN))return;
  if(!(g<y && y<r && r<b))return;
  TimerState.thresholds={green:g,yellow:y,red:r,blink:b};
  closeModal();enableControls();highlight(modalTrigger);
}
function setPreset(g,y,r,b,btn){
  if(TimerState.status!=='init')return;
  TimerState.thresholds={green:g*60,yellow:y*60,red:r*60,blink:b*60};
  enableControls();highlight(btn);
}
function highlight(btn){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  TimerState.selectedPreset=btn;
  document.getElementById('mainControl').classList.add('active');
}

/* === 控制 === */
function mainControl(){
  if(isCustomModalOpen())return;
  if(TimerState.status==='init') startTimer();
  else if(TimerState.status==='running') pauseTimer();
  else if(TimerState.status==='paused') resumeTimer();
}
function startTimer(){
  TimerState.status='running';
  TimerState.startAt=performance.now();
  requestWakeLock();
  TimerState.timer=setInterval(update,100);
  document.getElementById('mainControl').textContent='⏸️ 暫停';
  document.getElementById('reset').disabled=true;
  document.querySelectorAll('.preset-btn').forEach(b=>b.disabled=true);
  toggleBottomBar(false);
}
function pauseTimer(){
  update();
  TimerState.elapsedMs+=Math.max(0,performance.now()-TimerState.startAt);
  TimerState.time=Math.floor(TimerState.elapsedMs/1000);
  updateDisplay();
  clearInterval(TimerState.timer);
  TimerState.status='paused';
  document.getElementById('mainControl').textContent='▶️ 繼續';
  document.getElementById('reset').disabled=false;
  document.getElementById('reset').classList.add('active');
  toggleBottomBar(true);
  if(TimerState.blink){clearInterval(TimerState.blink);TimerState.blink=null;}
}
function resumeTimer(){
  TimerState.startAt=performance.now();
  requestWakeLock();
  TimerState.timer=setInterval(update,100);
  TimerState.status='running';
  document.getElementById('mainControl').textContent='⏸️ 暫停';
  document.getElementById('reset').disabled=true;
  document.getElementById('reset').classList.remove('active');
  toggleBottomBar(false);
}
function resetTimer(){
  clearInterval(TimerState.timer);
  if(TimerState.blink){clearInterval(TimerState.blink);TimerState.blink=null;}
  document.body.style.background='#111';
  document.getElementById('symbol').textContent='';
  document.getElementById('avatar').style.filter='invert(0)';
  document.getElementById('title').style.color='#fff';
  TimerState.status='init';TimerState.time=0;TimerState.elapsedMs=0;TimerState.startAt=0;
  updateDisplay();
  document.getElementById('mainControl').textContent='▶️ 開始';
  document.getElementById('mainControl').classList.remove('active');
  document.getElementById('mainControl').disabled=true;
  document.getElementById('reset').disabled=true;
  document.getElementById('reset').classList.remove('active');
  document.querySelectorAll('.preset-btn').forEach(b=>{b.disabled=false;b.classList.remove('selected');});
  toggleBottomBar(true);
  TimerState.blinkState=false;
}
function enableControls(){
  document.getElementById('mainControl').disabled=false;
  toggleBottomBar(true);
}

/* === 更新 === */
function update(){
  const runningMs=TimerState.status==='running'?Math.max(0,performance.now()-TimerState.startAt):0;
  TimerState.time=Math.floor((TimerState.elapsedMs+runningMs)/1000);
  updateDisplay();updateBg();
}
function updateDisplay(){
  const m=Math.floor(TimerState.time/60),s=TimerState.time%60;
  document.querySelector('#display span').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* === 背景與符號 === */
function updateBg(){
  const sym=document.getElementById('symbol');
  const avatar=document.getElementById('avatar');
  const title=document.getElementById('title');
  const t=TimerState.time, th=TimerState.thresholds;
  if(t>=th.blink){
    if(!TimerState.blink && TimerState.status==='running'){
      TimerState.blink=setInterval(()=>{
        TimerState.blinkState=!TimerState.blinkState;
        document.body.style.background=TimerState.blinkState?'#FF2400':'#000000';
        avatar.style.filter=TimerState.blinkState?'invert(0)':'invert(1)';
      },300);
    }
    sym.textContent='❌';title.style.color='#fff';
  } else {
    if(TimerState.blink){clearInterval(TimerState.blink);TimerState.blink=null;document.body.style.background='#FF2400';}
    if(t>=th.red){document.body.style.background='#FF2400';sym.textContent='⛔';title.style.color='#fff';avatar.style.filter='invert(1)';}
    else if(t>=th.yellow){document.body.style.background='#FFD55A';sym.textContent='⚠️';title.style.color='#000';avatar.style.filter='invert(1)';}
    else if(t>=th.green){document.body.style.background='#4B5320';sym.textContent='☑️';title.style.color='#fff';avatar.style.filter='invert(1)';}
    else{document.body.style.background='#111';sym.textContent='';title.style.color='#fff';avatar.style.filter='invert(0)';}
  }
}

/* === 其他 === */
let fullscreenPending=false;
function syncFullscreenButton(){
  const button=document.getElementById('fsBtn');
  const active=!!document.fullscreenElement;
  button.textContent=active?'❌ 結束全螢幕':'🔲 全螢幕';
  button.setAttribute('aria-pressed', String(active));
}
async function toggleFullscreen(){
  if(fullscreenPending)return;
  const entering=!document.fullscreenElement;
  const target=entering?document.documentElement:document;
  const action=entering?target.requestFullscreen:target.exitFullscreen;
  if(typeof action!=='function' || (entering && document.fullscreenEnabled===false)){
    setNotice('fullscreenNotice','此瀏覽器不支援頁面全螢幕，仍可在目前畫面使用計時器。');
    syncFullscreenButton();return;
  }
  fullscreenPending=true;
  try {
    await action.call(target);
    setNotice('fullscreenNotice','');
  } catch(err) {
    setNotice('fullscreenNotice','無法切換全螢幕，請再試一次或使用瀏覽器的全螢幕功能。');
  } finally {
    fullscreenPending=false;
    syncFullscreenButton();
  }
}
document.addEventListener('fullscreenchange',syncFullscreenButton);
syncFullscreenButton();
function handleOrientation(){
  const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const isLandscape=window.matchMedia("(orientation: landscape)").matches;
  const tip=document.getElementById('rotateTip');
  const content=document.getElementById('appContent');
  if(isMobile && isLandscape){tip.style.display='flex';content.style.display='none';}
  else{tip.style.display='none';content.style.display='block';scaleApp();}
}
function scaleApp(){
  const app=document.getElementById('appContent');
  const baseWidth=360, baseHeight=640;
  const scale=Math.min(window.innerWidth/baseWidth, window.innerHeight/baseHeight);
  app.style.transform=`translate(-50%, -50%) scale(${scale})`;
}
// 先依視窗尺寸完成排版，不等待頭像下載。
handleOrientation();
window.addEventListener('resize',handleOrientation);
window.addEventListener('orientationchange',handleOrientation);
window.addEventListener('load',handleOrientation);
</script>
